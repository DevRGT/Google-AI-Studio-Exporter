<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Main blue-cyan gradient -->
    <linearGradient id="mainGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <!-- Glow gradient -->
    <radialGradient id="glowGrad" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#1a73e8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d47a1" stop-opacity="0"/>
    </radialGradient>
    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <!-- Outer glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="64" cy="48" r="48" fill="url(#glowGrad)"/>

  <!-- Neural network globe -->
  <g filter="url(#glow)" opacity="0.95">
    <!-- Globe outline -->
    <circle cx="64" cy="45" r="32" fill="none" stroke="url(#mainGrad)" stroke-width="1.5" opacity="0.7"/>

    <!-- Horizontal arcs -->
    <ellipse cx="64" cy="45" rx="32" ry="10" fill="none" stroke="#1a73e8" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="64" cy="45" rx="28" ry="20" fill="none" stroke="#1a73e8" stroke-width="0.8" opacity="0.5"/>

    <!-- Vertical arcs -->
    <ellipse cx="64" cy="45" rx="10" ry="32" fill="none" stroke="#1a73e8" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="64" cy="45" rx="20" ry="32" fill="none" stroke="#1a73e8" stroke-width="0.8" opacity="0.5"/>

    <!-- Diagonal cross lines for network feel -->
    <line x1="38" y1="22" x2="90" y2="68" stroke="#00bcd4" stroke-width="0.6" opacity="0.4"/>
    <line x1="90" y1="22" x2="38" y2="68" stroke="#00bcd4" stroke-width="0.6" opacity="0.4"/>
    <line x1="34" y1="38" x2="94" y2="52" stroke="#00bcd4" stroke-width="0.6" opacity="0.4"/>
    <line x1="34" y1="52" x2="94" y2="38" stroke="#00bcd4" stroke-width="0.6" opacity="0.4"/>

    <!-- Network nodes (dots) -->
    <!-- Top -->
    <circle cx="64" cy="13" r="2.5" fill="#00e5ff"/>
    <!-- Upper ring -->
    <circle cx="44" cy="22" r="2" fill="#00bcd4"/>
    <circle cx="84" cy="22" r="2" fill="#00bcd4"/>
    <circle cx="64" cy="25" r="2" fill="#00e5ff"/>
    <!-- Middle ring -->
    <circle cx="32" cy="38" r="2" fill="#1a73e8"/>
    <circle cx="48" cy="35" r="2.5" fill="#00e5ff"/>
    <circle cx="64" cy="45" r="3" fill="#00e5ff"/>
    <circle cx="80" cy="35" r="2.5" fill="#00e5ff"/>
    <circle cx="96" cy="38" r="2" fill="#1a73e8"/>
    <!-- Lower ring -->
    <circle cx="36" cy="55" r="2" fill="#1a73e8"/>
    <circle cx="52" cy="55" r="2" fill="#00bcd4"/>
    <circle cx="76" cy="55" r="2" fill="#00bcd4"/>
    <circle cx="92" cy="55" r="2" fill="#1a73e8"/>
    <!-- Bottom -->
    <circle cx="44" cy="68" r="2" fill="#1a73e8"/>
    <circle cx="64" cy="72" r="2" fill="#1a73e8"/>
    <circle cx="84" cy="68" r="2" fill="#1a73e8"/>

    <!-- Network connections (lines between nodes) -->
    <g stroke="#00bcd4" stroke-width="0.7" opacity="0.6">
      <line x1="64" y1="13" x2="44" y2="22"/>
      <line x1="64" y1="13" x2="84" y2="22"/>
      <line x1="64" y1="13" x2="64" y2="25"/>
      <line x1="44" y1="22" x2="48" y2="35"/>
      <line x1="44" y1="22" x2="32" y2="38"/>
      <line x1="84" y1="22" x2="80" y2="35"/>
      <line x1="84" y1="22" x2="96" y2="38"/>
      <line x1="64" y1="25" x2="48" y2="35"/>
      <line x1="64" y1="25" x2="80" y2="35"/>
      <line x1="48" y1="35" x2="64" y2="45"/>
      <line x1="80" y1="35" x2="64" y2="45"/>
      <line x1="32" y1="38" x2="36" y2="55"/>
      <line x1="96" y1="38" x2="92" y2="55"/>
      <line x1="64" y1="45" x2="52" y2="55"/>
      <line x1="64" y1="45" x2="76" y2="55"/>
      <line x1="36" y1="55" x2="44" y2="68"/>
      <line x1="52" y1="55" x2="64" y2="72"/>
      <line x1="76" y1="55" x2="64" y2="72"/>
      <line x1="92" y1="55" x2="84" y2="68"/>
      <line x1="48" y1="35" x2="32" y2="38"/>
      <line x1="80" y1="35" x2="96" y2="38"/>
      <line x1="52" y1="55" x2="36" y2="55"/>
      <line x1="76" y1="55" x2="92" y2="55"/>
    </g>

    <!-- Center bright node -->
    <circle cx="64" cy="45" r="4" fill="#00e5ff" opacity="0.9" filter="url(#softGlow)"/>
    <circle cx="64" cy="45" r="2.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Data stream lines flowing into arrow -->
  <g opacity="0.5">
    <line x1="60" y1="68" x2="60" y2="82" stroke="#00e5ff" stroke-width="1" opacity="0.6"/>
    <line x1="64" y1="70" x2="64" y2="85" stroke="#00bcd4" stroke-width="1.5" opacity="0.7"/>
    <line x1="68" y1="68" x2="68" y2="82" stroke="#00e5ff" stroke-width="1" opacity="0.6"/>
    <line x1="56" y1="72" x2="56" y2="80" stroke="#1a73e8" stroke-width="0.8" opacity="0.4"/>
    <line x1="72" y1="72" x2="72" y2="80" stroke="#1a73e8" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Export arrow -->
  <g filter="url(#glow)">
    <!-- Arrow shaft -->
    <rect x="56" y="72" width="16" height="30" rx="2" fill="url(#arrowGrad)"/>
    <!-- Arrow head -->
    <polygon points="44,100 64,120 84,100" fill="url(#arrowGrad)"/>
    <!-- Arrow highlight -->
    <rect x="60" y="75" width="3" height="25" rx="1" fill="#00e5ff" opacity="0.4"/>
  </g>
</svg>
