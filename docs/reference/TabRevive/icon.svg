<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc6a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Main circle -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#iconGrad)" stroke-width="3" opacity="0.3"/>
  
  <!-- Inner circle with glow -->
  <circle cx="64" cy="64" r="18" fill="url(#iconGrad)" filter="url(#glow)"/>
  
  <!-- Power symbol -->
  <rect x="62" y="46" width="4" height="16" rx="2" fill="#000000"/>
  <path d="M64 52 L64 46" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pulse rings -->
  <circle cx="64" cy="64" r="28" fill="none" stroke="url(#iconGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="28;32;28" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="64" cy="64" r="32" fill="none" stroke="url(#iconGrad)" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="32;38;32" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Corner indicators -->
  <rect x="20" y="20" width="8" height="8" rx="4" fill="url(#iconGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="100" y="20" width="8" height="8" rx="4" fill="url(#iconGrad)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="20" y="100" width="8" height="8" rx="4" fill="url(#iconGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="100" y="100" width="8" height="8" rx="4" fill="url(#iconGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>